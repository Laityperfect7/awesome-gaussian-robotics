[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "gaussian-robotics-atlas"
version = "0.1.0"
description = "A verified, queryable compatibility atlas for Gaussian Splatting in robotics."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE-CODE" }
authors = [{ name = "Gaussian Robotics Atlas contributors" }]
keywords = [
  "robotics",
  "gaussian-splatting",
  "3dgs",
  "slam",
  "embodied-ai",
  "awesome-list",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema>=4.23",
  "mypy>=1.11",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
gr-atlas = "gaussian_robotics_atlas.cli:main"

[project.urls]
Homepage = "https://github.com/Laityperfect7/awesome-gaussian-robotics"
Documentation = "https://github.com/Laityperfect7/awesome-gaussian-robotics/tree/main/docs"
Issues = "https://github.com/Laityperfect7/awesome-gaussian-robotics/issues"
Source = "https://github.com/Laityperfect7/awesome-gaussian-robotics"

[tool.hatch.build.targets.wheel]
packages = ["src/gaussian_robotics_atlas"]

[tool.hatch.build.targets.wheel.force-include]
"catalog" = "gaussian_robotics_atlas/catalog"
"schema" = "gaussian_robotics_atlas/schema"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["gaussian_robotics_atlas"]

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"src/gaussian_robotics_atlas/render.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["gaussian_robotics_atlas"]
